[server]
port = 8501
headless = true
sslCertFile = "certs/cert.pem"
sslKeyFile = "certs/key.pem"
enableCORS = false
enableXsrfProtection = true

[browser]
serverAddress = "localhost"
serverPort = 8501
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#2f81f7"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"
font = "sans serif"
